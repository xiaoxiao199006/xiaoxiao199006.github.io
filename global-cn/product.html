<script src="assets/js/products.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function(){
  var P = window.PRODUCTS, JW = window.JW;
  var id = new URLSearchParams(location.search).get('id');
  var p = id ? JW.byId(id) : null;
  var root = document.getElementById('detail-root');
  var rel = document.getElementById('related-grid');

  if (!p) {
    root.innerHTML = '<div class="empty">未找到该产品。<a href="catalog.html">浏览全部目的地</a>。</div>';
    rel.innerHTML = '';
    return;
  }

  var fav = JW.isFav(p.id);
  var incl = (p.included || []).map(function(x){ return '<li>' + JW.esc(x) + '</li>'; }).join('');
  var excl = (p.excluded || []).map(function(x){ return '<li>' + JW.esc(x) + '</li>'; }).join('');

  var galleryHTML = p.img
    ? '<div class="gallery"><img src="' + JW.esc(p.img) + '" alt="' + JW.esc(p.name) + '"></div>'
    : '<div class="gallery ph--' + p.cat + '"><div class="ph"><span class="media-icon">' + JW.catIcon(p.cat) + '</span><div class="media-city">' + JW.esc(p.city) + '</div><div class="media-cat">' + JW.esc(JW.CAT[p.cat].label) + '</div></div></div>';
  var itinHTML = (p.itinerary && p.itinerary.length)
    ? '<div class="panel itin-panel"><h3>行程流程</h3><ol class="tl">' + p.itinerary.map(function(s){ return '<li><span class="tl-phase">' + JW.esc(s.phase) + '</span><span class="tl-text">' + JW.esc(s.text) + '</span></li>'; }).join('') + '</ol></div>'
    : '';

  root.innerHTML =
    '<nav style="font-size:12.5px;color:var(--slate-soft);margin-bottom:18px;"><a href="index.html">首页</a> · <a href="catalog.html">目的地</a> · <a href="catalog.html?region=' + encodeURIComponent(p.region) + '">' + JW.esc(p.region) + '</a></nav>' +
    '<div class="detail">' +
      galleryHTML +
      '<div class="side">' +
        '<div>' + JW.starsHTML(p.tags.stars) + (p.standalone ? ' <span class="tag tag--plain">仅门票/咨询</span>' : '') + '</div>' +
        '<h1>' + JW.esc(p.name) + '</h1>' +
        JW.metaHTML(p) +
        '<p style="margin-top:14px;">' + JW.esc(p.desc) + '</p>' +
        '<div class="panel" style="margin-top:16px;">' + JW.priceHTML(p) + '</div>' +
        '<div class="cta-row" style="margin-top:16px;">' +
          '<button class="btn-fav' + (fav ? ' on' : '') + '" data-fav="' + JW.esc(p.id) + '">' + (fav ? '♥ 已收藏' : '♡ 收藏') + '</button>' +
          (p.standalone
            ? '<a class="btn btn--line" href="inquiry.html?id=' + JW.esc(p.id) + '">单独咨询购票</a>'
            : p.cat === 'hotel'
              ? '<a class="btn btn--gold" href="planner.html?add=' + JW.esc(p.id) + '">加入酒店列表</a>'
              : '<a class="btn btn--gold" href="planner.html?add=' + JW.esc(p.id) + '">加入我的行程</a>') +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="grid grid--2" style="margin-top:24px;gap:16px;">' +
      '<div class="panel"><h3>费用包含</h3><ul class="fact-list">' + incl + '</ul></div>' +
      '<div class="panel"><h3>费用不含</h3><ul class="fact-list">' + excl + '</ul></div>' +
    '</div>' +
    (p.note ? '<div class="note-box"><b>出行须知：</b> ' + JW.esc(p.note) + '</div>' : '') +
    itinHTML;

  /* 相关推荐：同目的地优先，再看同人群、同品类，排除自身，最多 3 条 */
  var rels = P.filter(function(x){ return x.id !== p.id; })
    .map(function(x){
      var score = (x.continent === p.continent ? 1 : 0) + (x.region === p.region ? 2 : 0) + (x.tags.age === p.tags.age ? 1 : 0) + (x.cat === p.cat ? 1 : 0);
      return { x: x, score: score };
    })
    .filter(function(r){ return r.score > 0; })
    .sort(function(a,b){ return b.score - a.score; })
    .slice(0, 3).map(function(r){ return r.x; });
  JW.renderCards(rel, rels, '');
})();
</script>
